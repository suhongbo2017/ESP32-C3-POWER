name: pc-power-cloud

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: 8310
    ports:
      - "127.0.0.1:8310:8310"
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pcpower}
      POSTGRES_USER: ${POSTGRES_USER:-pcpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in cloud/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcpower} -d ${POSTGRES_DB:-pcpower}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    expose:
      - "1883"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    name: pc-power-cloud-backend
    driver: bridge
