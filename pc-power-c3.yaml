# ============================================================================
# ESP32-C3 SuperMini —— 机箱电源键短按控制器 (ESPHome)
#
# 快速开始:
#   cp secrets.yaml.example secrets.yaml   # 然后填入自己的密码/密钥
#   esphome config pc-power-c3.yaml        # 语法检查
#   esphome run pc-power-c3.yaml           # 首次 USB 烧录，之后走 OTA
#
# 硬件接线 (务必先看 README 的"硬件安全"一节):
#   GPIO1 --[220~330Ω]-- 光耦 IN+
#   GPIO1 --[10kΩ]------ GND          <- 必须, 防止上电瞬间误触发
#   GND   -------------- 光耦 IN-
#   光耦 S1/S2 --------- 主板 PWR_SW 两针
# ============================================================================

substitutions:
  device_name: pc-power-c3
  friendly_name: PC Power C3
  pulse_ms: 300ms          # 电源键短按持续时间

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "机箱电源键脉冲控制器"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf        # C3 推荐 esp-idf；如日后需要 Arduino 生态可改成 arduino

logger:
  level: DEBUG
  # SuperMini 的 USB-C 直连芯片自带的 USB-Serial-JTAG，无需 CH340
  hardware_uart: USB_SERIAL_JTAG

# ---------------------------------------------------------------------------
# 接入 Home Assistant 用。不需要 HA 时整段删掉即可（web_server 仍然可用）。
# 密钥生成: openssl rand -base64 32
# ---------------------------------------------------------------------------
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# 连接家庭 2.4GHz Wi-Fi；主网络不可用时启动备用 AP。
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "PC-Power-C3"
    password: !secret ap_password

web_server:
  port: 80
  version: 2             # 使用内置资源，独立 AP 模式下无需外网
  auth:
    username: admin
    password: !secret web_password

safe_mode:                 # 固件刷坏时自动进安全模式，可再次 OTA 救援

# ===========================================================================
# 核心：电源键 300ms 短按脉冲
# ===========================================================================
switch:
  - platform: gpio
    id: pwr_sw
    name: "${friendly_name} 电源键脉冲"
    icon: mdi:power
    pin: GPIO1
    # 上电/复位/OTA 期间强制输出低电平，与旧固件的 safe state 一致
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: ${pulse_ms}     # ESPHome 的 delay 是非阻塞的(set_timeout)
      - switch.turn_off: pwr_sw
    # 重复触发保护: GPIO switch 已 ON 时再次 turn_on 会被忽略，
    # 因此连点不会叠加出长按，行为与旧固件的 "pulse_rejected_busy" 等价。

button:
  - platform: template
    name: "${friendly_name} 电源键短按"
    icon: mdi:power-cycle
    on_press:
      - switch.turn_on: pwr_sw

  - platform: safe_mode
    name: "${friendly_name} 进入 Safe Mode"

  - platform: restart
    name: "${friendly_name} 重启"

