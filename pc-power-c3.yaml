  birth_message:
    topic: pc-power-c3-001/status/online
    payload: '{"online":true}'
    qos: 1
    retain: true
  will_message:
    topic: pc-power-c3-001/status/offline
    payload: '{"online":false}'
    qos: 1
    retain: true
  shutdown_message:
    topic: pc-power-c3-001/status/offline
    payload: '{"online":false}'
    qos: 1
    retain: true
  on_json_message:
    - topic: pc-power-c3-001/commands/power-press
      qos: 1
      then:
        - if:
            condition:
              lambda: 'return !id(pwr_sw).state && x["kind"] == "power_press" && x["commandId"].is<const char*>();'
            then:
              - lambda: 'id(last_command_id) = x["commandId"].as<std::string>();'
              - mqtt.publish_json:
                  topic: pc-power-c3-001/events/command-ack
                  qos: 1
                  payload: |-
                    root["commandId"] = id(last_command_id);
                    root["status"] = "accepted";
              - switch.turn_on: pwr_sw

# ===========================================================================
# 核心：电源键 300ms 短按脉冲
# ===========================================================================
switch:
  - platform: gpio
    id: pwr_sw
    name: "${friendly_name} 电源键脉冲"
    icon: mdi:power
    pin: GPIO1
    # 上电/复位/OTA 期间强制输出低电平，与旧固件的 safe state 一致
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: ${pulse_ms}     # ESPHome 的 delay 是非阻塞的(set_timeout)
      - switch.turn_off: pwr_sw
      - if:
          condition:
            lambda: 'return !id(last_command_id).empty();'
          then:
            - mqtt.publish_json:
                topic: pc-power-c3-001/events/command-ack
                qos: 1
                payload: |-
                  root["commandId"] = id(last_command_id);
                  root["status"] = "executed";
            - lambda: 'id(last_command_id).clear();'
    # 重复触发保护: GPIO switch 已 ON 时再次 turn_on 会被忽略，
    # 因此连点不会叠加出长按，行为与旧固件的 "pulse_rejected_busy" 等价。

button:
  - platform: template
    name: "${friendly_name} 电源键短按"
    icon: mdi:power-cycle
    on_press:
      - switch.turn_on: pwr_sw

  - platform: safe_mode
    name: "${friendly_name} 进入 Safe Mode"

  - platform: restart
    name: "${friendly_name} 重启"

