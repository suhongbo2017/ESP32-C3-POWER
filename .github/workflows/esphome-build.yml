name: ESPHome firmware build

on:
  workflow_dispatch:
  push:
    paths:
      - "pc-power-c3.yaml"
      - "mqtt-isrgrootx1.pem"
      - ".github/workflows/esphome-build.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.6.5"

      - name: Create CI-only secrets
        shell: bash
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: ""
          wifi_password: ""
          ap_password: "CI_BUILD_AP_PASSWORD"
          ota_password: "CI_BUILD_OTA_PASSWORD"
          web_password: "CI_BUILD_WEB_PASSWORD"
          api_key: "Huep2tMxTk23QJzpbORpFKPFtfVwG+SWSGFQshlEdYA="
          mqtt_host: "mqtt.19831018.xyz"
          mqtt_username: "ci-build-device"
          mqtt_password: "CI_BUILD_MQTT_PASSWORD"
          EOF

      - name: Validate configuration
        run: esphome config pc-power-c3.yaml

      - name: Compile firmware
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          esphome compile pc-power-c3.yaml 2>&1 | tee esphome-compile.log

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "=== ESPHome version ==="
            esphome version
            echo "=== Build files ==="
            find .esphome/build/pc-power-c3 -maxdepth 5 -type f 2>/dev/null | sort | head -300
            echo "=== Compiler errors and warnings ==="
            grep -RniE "error:|fatal error:|undefined reference|FAILED:|warning:" .esphome/build/pc-power-c3 2>/dev/null | head -300 || true
          } > build-diagnostics.txt

      - name: Publish compiler diagnostics
        if: always()
        shell: bash
        run: |
          echo "## ESPHome compiler diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ -f esphome-compile.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 esphome-compile.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|fatal error:|undefined reference|FAILED:" esphome-compile.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done || true
          fi
          if [ -f build-diagnostics.txt ]; then
            echo '### Build diagnostics' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat build-diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-power-c3-build-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          path: |
            esphome-compile.log
            build-diagnostics.txt
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/CMakeFiles/CMakeError.log
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/CMakeFiles/CMakeOutput.log

      - name: Fail if compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1

      - name: Prepare complete flash image
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          build_dir=.esphome/build/pc-power-c3/.pioenvs/pc-power-c3
          bootloader=$(find "$build_dir" -type f -name bootloader.bin -print -quit)
          partitions=$(find "$build_dir" -type f -name partitions.bin -print -quit)
          firmware="$build_dir/firmware.bin"
          test -n "$bootloader"
          test -n "$partitions"
          test -f "$firmware"
          python -m esptool --chip esp32c3 merge-bin \
            -o "$build_dir/firmware-full.bin" \
            --flash-mode dio --flash-size 4MB \
            0x0 "$bootloader" \
            0x8000 "$partitions" \
            0x10000 "$firmware"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pc-power-c3-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/firmware-full.bin
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/bootloader.bin
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/partitions.bin
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/firmware.bin
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/firmware.elf
            .esphome/build/pc-power-c3/.pioenvs/pc-power-c3/firmware.map
